name: Build TankVisuals

on:
  workflow_dispatch:
  push:
    paths:
      - "TankVisuals-1.0.0-source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract source archive
        run: unzip -q TankVisuals-1.0.0-source.zip

      - name: Write clean compatible TankVisualsClient.java
        run: |
          cat << 'EOF' > TankVisuals/src/main/java/com/tankvisuals/TankVisualsClient.java
          package com.tankvisuals;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.RenderTickCounter;

          public class TankVisualsClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  HudRenderCallback.EVENT.register(TankVisualsClient::renderHud);
              }

              private static void renderHud(DrawContext context, RenderTickCounter tickCounter) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client == null || client.player == null) return;
                  
                  // Базовый рендер для проверки сборки
                  int fps = MinecraftClient.getCurrentFps();
                  context.drawTextWithShadow(client.textRenderer, "TankVisuals: " + fps + " FPS", 10, 10, 0x00FF66);
              }
          }
          EOF

      - name: Build mod
        working-directory: TankVisuals
        run: gradle build --no-daemon

      - name: Upload Minecraft mod
        uses: actions/upload-artifact@v4
        with:
          name: TankVisuals-1.0.0
          path: TankVisuals/build/libs/tankvisuals-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
