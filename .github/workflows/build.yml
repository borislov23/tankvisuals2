name: Build TankVisuals

on:
  workflow_dispatch:
  push:
    paths:
      - "TankVisuals-1.0.0-source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract source archive
        run: unzip -q TankVisuals-1.0.0-source.zip

      - name: Fix 1.21.4 HudRenderCallback Compatibility
        working-directory: TankVisuals
        run: |
          sed -i 's/void renderHud(DrawContext context, float tickDelta)/void renderHud(DrawContext context, net.minecraft.client.render.RenderTickCounter tickCounter)/g' src/main/java/com/tankvisuals/TankVisualsClient.java
          sed -i 's/void renderHud(DrawContext drawContext, float tickDelta)/void renderHud(DrawContext drawContext, net.minecraft.client.render.RenderTickCounter tickCounter)/g' src/main/java/com/tankvisuals/TankVisualsClient.java

      - name: Build mod
        working-directory: TankVisuals
        run: gradle build --no-daemon

      - name: Upload Minecraft mod
        uses: actions/upload-artifact@v4
        with:
          name: TankVisuals-1.0.0
          path: TankVisuals/build/libs/tankvisuals-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
